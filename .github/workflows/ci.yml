name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hostsent
          POSTGRES_PASSWORD: hostsent
          POSTGRES_DB: hostsent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hostsent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod 的 go 指令是 1.26.9（批次四 D3）：1.25 线已停修复，
          # 标准库漏洞（net/http、crypto/tls、net/url 等）只能由 1.26 修。
          go-version: "1.26.9"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        # -count=1 关掉测试结果缓存：menu_align_test.go 读 frontend-admin 的 router/index.ts、
        # permission.ts 与 pages/，live 用例读 migrations/*.sql —— 这些都不是 Go 源码、
        # 不进 cache key。前端单独改动时若吃到缓存，「菜单四处对齐」「迁移幂等」会假通过。
        run: go test -count=1 ./...
      - name: Live tests (fresh DB)
        # 批次四 D2：对 postgres service 的全新空库跑「引导 + live 套件」。
        # 引导走生产同款路径（AutoMigrate + Seed），不依赖历史 SQL 迁移，
        # 专抓「全新部署缺表/缺列/缺索引、Seed 崩溃」这类老库上永远测不出的问题。
        # 步骤内先后两次 go test 使用同一 DSN：先 LIVE_BOOTSTRAP=1 建 schema，
        # 随后套件里所有 live 用例共享这个刚引导完的实例。
        env:
          LIVE_DB_DSN: host=127.0.0.1 port=5432 user=hostsent password=hostsent dbname=hostsent sslmode=disable
        run: |
          LIVE_BOOTSTRAP=1 go test -count=1 -tags live ./internal/server/ -run 'TestLiveBootstrapSchema$'
          go test -count=1 -tags live ./internal/server/... ./internal/pkg/db/...
      - name: Vulnerability scan (Go)
        # 批次四 D3：govulncheck 源码模式只报「代码实际可达」的漏洞；
        # 模块存在但代码未触达的（如 x/crypto/openpgp 弃用告警）不阻断。
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26.9"
          go-package: ./...
      - name: Coverage report
        # 全量报告（只展示，不上门禁）：阈值只盯下面两个核心包。
        run: go test -count=1 -cover ./internal/modules/...
      - name: Coverage gate (core packages)
        # 批次四 D1：核心链路门禁（check_coverage.sh 内置阈值），
        # 只盯下单/退款/开通两个资金履约包，避免全量阈值逼出凑数测试。
        run: ../scripts/check_coverage.sh
      - name: Lint
        # 门禁已转 error（批次三 C5）：errcheck/staticcheck/unused/revive 双构建
        # （普通 + `-tags live`）清零。live 用例在「Live tests (fresh DB)」步骤跑，
        # 此处带 live tag 一并静态检查，编译错误在 CI 早于运行阶段暴露。
        # 版本 v2.14.0：随 go.mod 升到 go1.26.9（批次四 D3），旧版用低版本
        # Go 编译、拒绝加载高版本目标模块。
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: backend
          args: --timeout=5m --build-tags live
      - name: Race (core packages)
        # -race 抽样核心资金/履约链路（115 批次五 G6），全量 -race 留给 nightly。
        run: go test -race -count=1 ./internal/modules/admin/finance/... ./internal/modules/admin/instance/... ./internal/modules/admin/order/...
      - name: Structure check
        # 先跑 fixture 自测（检查逻辑退化了要 fail），再跑正式检查。
        run: |
          ../scripts/check_structure.sh --selfcheck
          ../scripts/check_structure.sh
      - name: API contract check
        # 批次四 D4b：前端 request/instance 调用与后端 Go 路由表对齐
        # （方法+路径双维度，形状归一化比较），漂移即 fail。
        # 依赖后端源码 + 前端 src/api 目录，放在 checkout 之后任意位置皆可。
        run: |
          python3 ../scripts/check_api_contract.py --selfcheck
          python3 ../scripts/check_api_contract.py
      - name: OpenAPI generator self-check
        # openapi.yaml 是生成产物（/backend/docs 整体 .gitignore，不进版本库）；
        # 漂移门禁 = 生成器自检退出码：新增路由未登记 HANDLER_ACTIONS /
        # overrides 规则即失败，保证「路由改了但文档规则没跟上」在 CI 拦截。
        run: python3 scripts/gen_openapi.py

  frontend-admin:
    name: Admin Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 8 要求 node ^20.19 || >=22.12（批次四 D3 升级），用 22 稳定线。
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        # 批次四 D4：ESLint flat 配置（eslint.config.mjs），0 error 门禁；
        # 风格由 Prettier 承担（format:check），与仓库既有风格对齐（单引号/无分号/尾逗号）。
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Audit (npm)
        # 批次四 D3/D4：只审计生产依赖（--omit=dev）。dev 工具链里 eslint 的
        # fast-glob→braces 链条上游暂无修复版（braces<=3.0.3 的 DoS 告警），
        # 不进浏览器产物；若做全量审计门禁会永久失败，属不可修复的假阳性。
        run: npm audit --omit=dev --audit-level=low

  frontend-user:
    name: User Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Audit (npm)
        # 同上：只审计生产依赖。
        run: npm audit --omit=dev --audit-level=low
