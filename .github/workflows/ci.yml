name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        # -count=1 关掉测试结果缓存：menu_align_test.go 读 frontend-admin 的 router/index.ts、
        # permission.ts 与 pages/，live 用例读 migrations/*.sql —— 这些都不是 Go 源码、
        # 不进 cache key。前端单独改动时若吃到缓存，「菜单四处对齐」「迁移幂等」会假通过。
        run: go test -count=1 ./...
      - name: Coverage report
        # 全量报告（只展示，不上门禁）：阈值只盯下面两个核心包。
        run: go test -count=1 -cover ./internal/modules/...
      - name: Coverage gate (core packages)
        # 批次四 D1：核心链路门禁（check_coverage.sh 内置阈值），
        # 只盯下单/退款/开通两个资金履约包，避免全量阈值逼出凑数测试。
        run: ../scripts/check_coverage.sh
      - name: Lint
        # 门禁已转 error（批次三 C5）：errcheck/staticcheck/unused/revive 双构建
        # （普通 + `-tags live`）清零。live 用例不跑 CI，但 live 文件的编译错误
        # 必须在此拦截，否则合并后本地跑 live 才炸。版本与本地一致（v2 配置格式）。
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.1
          working-directory: backend
          args: --timeout=5m --build-tags live
      - name: Race (core packages)
        # -race 抽样核心资金/履约链路（115 批次五 G6），全量 -race 留给 nightly。
        run: go test -race -count=1 ./internal/modules/admin/finance/... ./internal/modules/admin/instance/... ./internal/modules/admin/order/...
      - name: Structure check
        # 先跑 fixture 自测（检查逻辑退化了要 fail），再跑正式检查。
        run: |
          ../scripts/check_structure.sh --selfcheck
          ../scripts/check_structure.sh
      - name: OpenAPI generator self-check
        # openapi.yaml 是生成产物（/backend/docs 整体 .gitignore，不进版本库）；
        # 漂移门禁 = 生成器自检退出码：新增路由未登记 HANDLER_ACTIONS /
        # overrides 规则即失败，保证「路由改了但文档规则没跟上」在 CI 拦截。
        run: python3 scripts/gen_openapi.py

  frontend-admin:
    name: Admin Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  frontend-user:
    name: User Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
