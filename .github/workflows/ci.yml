name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        # -count=1 关掉测试结果缓存：menu_align_test.go 读 frontend-admin 的 router/index.ts、
        # permission.ts 与 pages/，live 用例读 migrations/*.sql —— 这些都不是 Go 源码、
        # 不进 cache key。前端单独改动时若吃到缓存，「菜单四处对齐」「迁移幂等」会假通过。
        run: go test -count=1 ./...
      - name: Lint (warn only)
        # 门禁从 warn 起步（115 批次五 G5）：违例不阻塞合并，收敛后移除
        # continue-on-error 改为阻塞。
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: backend
          args: --timeout=5m
        continue-on-error: true
      - name: Race (core packages)
        # -race 抽样核心资金/履约链路（115 批次五 G6），全量 -race 留给 nightly。
        run: go test -race -count=1 ./internal/modules/admin/finance/... ./internal/modules/admin/instance/... ./internal/modules/admin/order/...
      - name: Structure check
        run: ../scripts/check_structure.sh

  frontend-admin:
    name: Admin Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  frontend-user:
    name: User Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
