services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hostsent
      POSTGRES_USER: hostsent
      POSTGRES_PASSWORD: hostsent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostsent -d hostsent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOSTSENT_APP_ENV: development
      HOSTSENT_DATABASE_HOST: postgres
      HOSTSENT_DATABASE_PORT: 5432
      HOSTSENT_DATABASE_USER: hostsent
      HOSTSENT_DATABASE_PASSWORD: hostsent
      HOSTSENT_DATABASE_NAME: hostsent
      HOSTSENT_DATABASE_SSLMODE: disable
      HOSTSENT_REDIS_HOST: redis
      HOSTSENT_REDIS_PORT: 6379
      HOSTSENT_REDIS_PASSWORD: ""
      HOSTSENT_REDIS_DB: 0
      # Redis 作为加速器而非依赖：连不通时降级到 DB 兜底，不阻断启动（doc89 §3.3）。
      HOSTSENT_REDIS_REQUIRED: "false"
      # 工单附件落盘目录（挂卷持久化，容器重建不丢文件）。
      HOSTSENT_STORAGE_ROOT: /app/uploads
      # 门户主动缓存失效（doc80 §10.1）：后台保存站点配置/发布内容后回调门户清 Nitro 缓存。
      # 门户跑在宿主机上（frontend-site，端口 3003），容器内经宿主机网关访问 ——
      # host.docker.internal 在 Linux 的 docker 引擎里默认不注册，因此用网段网关地址，
      # 由 compose 的 extra_hosts 注入（见文件底部）。
      HOSTSENT_REVALIDATE_PORTAL_URL: http://host.docker.internal:3003
      # 必须与 frontend-site/.env 的 NUXT_INTERNAL_TOKEN 一致，否则门户返回 401。
      # 留空 = 不启用主动失效（门户按 SWR TTL 自然刷新）。
      HOSTSENT_REVALIDATE_TOKEN: "${NUXT_INTERNAL_TOKEN:-cbe2929fd39925d1d777ca43648f9614b4052efd141bb8d2}"
    extra_hosts:
      # 让容器能解析到宿主机网关；配合宿主机防火墙放行对应端口。
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
