services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hostsent
      POSTGRES_USER: hostsent
      POSTGRES_PASSWORD: hostsent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostsent -d hostsent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOSTSENT_APP_ENV: development
      HOSTSENT_DATABASE_HOST: postgres
      HOSTSENT_DATABASE_PORT: 5432
      HOSTSENT_DATABASE_USER: hostsent
      HOSTSENT_DATABASE_PASSWORD: hostsent
      HOSTSENT_DATABASE_NAME: hostsent
      HOSTSENT_DATABASE_SSLMODE: disable
      HOSTSENT_REDIS_HOST: redis
      HOSTSENT_REDIS_PORT: 6379
      HOSTSENT_REDIS_PASSWORD: ""
      HOSTSENT_REDIS_DB: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
