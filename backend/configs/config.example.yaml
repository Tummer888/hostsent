app:
  name: hostsent-backend
  env: development
  host: 0.0.0.0
  port: 8080
  read_timeout: 10
  write_timeout: 10
  # 可信反向代理网段（CIDR），逗号分隔。只有直连对端落在这里面时，gin 才采信
  # X-Forwarded-For / X-Real-IP 还原客户端 IP；否则一律记对端地址。
  #
  # 留空/不配 = 仅信任回环（127.0.0.1/8、::1）。生产必须显式加上真实入口
  # （宿主机 nginx 所在网段、云负载均衡回源段）。**绝不要写 0.0.0.0/0**：
  # 该 IP 同时是登录失败锁定（failIPKey）的键，全信任等于开放伪造与绕过。
  # 可用 HOSTSENT_APP_TRUSTED_PROXIES=10.1.2.0/24,10.1.3.0/24 覆盖。
  trusted_proxies:
    - 127.0.0.1/8
    - ::1

auth:
  bearer_prefix: Bearer
  mock_token: mock-token

redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  # required=false（默认）：Redis 视为加速器而非依赖，连不通时验证码/限流降级到 DB 兜底；
  # 生产可置 true 强制启动自检失败即拒绝启动（doc89 §3.3）。
  required: false

pricing:
  # 多来源折扣叠加模式：best 取最优（默认）/ stack 按顺序叠加
  stack_mode: best

revalidate:
  # 门户主动缓存失效（doc80 §10.1）：后台保存站点配置/发布内容后回调门户清 Nitro 缓存。
  # portal_url 指向 frontend-site（容器内访问宿主机需用 host.docker.internal，
  # 并配合 docker-compose.yml 的 extra_hosts 与宿主机防火墙放行；见实施文档 §6）。
  # token 必须与 frontend-site 的 NUXT_INTERNAL_TOKEN 一致，否则门户返回 401。
  # 留空 = 不启用主动失效（门户按 SWR TTL 自然刷新，不会成为无鉴权端点）。
  portal_url: ""
  token: ""
