app:
  name: hostsent-backend
  env: development
  host: 0.0.0.0
  port: 8080
  read_timeout: 10
  write_timeout: 10
  # 可信反向代理网段（CIDR），逗号分隔。只有直连对端落在这里面，gin 才会采信
  # X-Forwarded-For / X-Real-IP 还原客户端 IP；否则一律记对端地址。
  #
  # 这里必须包含本机回环与 docker 网段：前端 dev server（3000/3002）与容器网关
  # 都在其中，否则用户 IP 会退化成「代理 IP」（实测就是 172.18.0.1）。
  # 生产部署时把宿主机 nginx / 云负载均衡的**真实入口网段**替换进来，
  # 千万不要写 0.0.0.0/0 —— 那等于让任何调用方用 X-Forwarded-For 伪造自己的 IP，
  # 而该 IP 同时是登录失败锁定（failIPKey）的键，可直接绕过撞库防护。
  trusted_proxies:
    - 127.0.0.1/8
    - ::1
    - 172.16.0.0/12
    - 10.0.0.0/8
    - 192.168.0.0/16

auth:
  bearer_prefix: Bearer
  jwt_secret: hostsent-dev-secret
  jwt_issuer: hostsent-backend
  jwt_expire_hours: 24

database:
  host: 127.0.0.1
  port: 5432
  user: hostsent
  password: hostsent
  name: hostsent
  sslmode: disable

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

pricing:
  # 多来源折扣叠加模式：best 取最优（默认）/ stack 按顺序叠加
  stack_mode: best

revalidate:
  # 门户主动缓存失效（doc80 §10.1）：后台保存配置/发布公告后回调门户清 Nitro 缓存，
  # 让「发布即见」不必等 SWR TTL。留空则不回调（纯后端联调够用）。
  # portal_url 指向 frontend-site；token 必须与门户的 NUXT_INTERNAL_TOKEN 一致。
  portal_url: "http://127.0.0.1:3003"
  token: "cbe2929fd39925d1d777ca43648f9614b4052efd141bb8d2"
